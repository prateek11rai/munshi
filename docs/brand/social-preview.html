<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Munshi social preview</title>
<link rel="stylesheet" href="brand.css">
<style>
  .stage { position: relative; width: 1280px; height: 640px; }
  .stage svg { position: absolute; inset: 0; }
  .card {
    position: absolute;
    left: 868px;
    top: 34px;
    width: 380px;
    height: 574px;
    overflow: hidden;
    border-radius: 10px;
    transform: rotate(3deg);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
  }
  .card img { display: block; width: 380px; height: 900px; }
</style>
</head>
<body>
<div class="stage">
  <svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="rows" width="1280" height="40" patternUnits="userSpaceOnUse">
        <rect class="rule" y="39" width="1280" height="1"/>
      </pattern>
    </defs>
    <rect class="bg" width="1280" height="640"/>
    <rect width="1280" height="640" fill="url(#rows)"/>
    <rect class="margin" x="384" width="1" height="640"/>
    <image href="../../src/munshi/ui/static/munshi.svg" x="-28" y="200" width="440" height="440"/>
    <text class="t-name" x="426" y="239" font-size="100">Munshi</text>
    <text class="t-tag" x="430" y="319" font-size="29">Your daily work register,</text>
    <text class="t-tag" x="430" y="359" font-size="29">kept by a 4B model on your Mac.</text>
    <text class="t-support" x="431" y="399" font-size="17">No screenshots. No keystrokes.</text>
    <text class="t-support" x="431" y="439" font-size="17">Nothing leaves your Mac.</text>
  </svg>
  <div class="card"><img src="../img/card.png" alt=""></div>
</div>
</body>
</html>
