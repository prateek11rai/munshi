name: model

on:
  push:
    branches: [main]
    paths:
      - "src/munshi/write/**"
      - "tests/test_model_real.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/model.yml"
  pull_request:
    paths:
      - "src/munshi/write/**"
      - "tests/test_model_real.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - run: uv sync --frozen
      - name: Install Ollama with the runner's Homebrew
        run: /home/linuxbrew/.linuxbrew/bin/brew install ollama
      - name: Start Ollama and pull the model
        run: |
          ollama=/home/linuxbrew/.linuxbrew/bin/ollama
          nohup "$ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do "$ollama" list > /dev/null 2>&1 && break; sleep 1; done
          "$ollama" pull gemma4:e4b
      - name: Model test
        run: uv run pytest -q -m model
